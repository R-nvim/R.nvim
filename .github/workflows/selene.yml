# https://github.com/Kampfkarren/selene/issues/284
name: Selene Lint Check
on: [push, pull_request]
jobs:
  sile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install selene
        run: |
          curl -L -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip selene.zip selene
          chmod +x selene
          sudo mv selene /usr/local/bin/selene
      - name: selene linter
        run: selene . --config selene.toml
